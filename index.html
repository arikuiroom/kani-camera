<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>カニギター 3D Viewer</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #f2f2f2; }
    #app { width: 100%; height: 100%; }
    #info {
      position: fixed; left: 16px; bottom: 16px; z-index: 10;
      padding: 10px 12px; border-radius: 10px;
      background: rgba(255,255,255,.84); color: #222;
      font: 13px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      backdrop-filter: blur(8px); box-shadow: 0 3px 18px rgba(0,0,0,.12);
    }
    #status { font-weight: 700; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="app"></div>
  <div id="info">
    <div id="status">読み込み中…</div>
    ドラッグ：回転 / ホイール：ズーム / 右ドラッグ：移動
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
